name: Daily update

# Every run checks what is still owed today, so a missed or failed run repairs itself at the next one:
#   the first successful weekday run reads new filings and trades ("full"); later runs only refresh prices ("mark").
on:
  schedule:
    - cron: "0 7 * * 1-5"            # weekdays 07:00 UTC: the main run
    - cron: "0 10,12 * * 1-5"         # retries if the main run was late or failed
    - cron: "30 14,16,18,20 * * 1-5"  # during US trading hours: fresh prices (and a retry if still owed)
    - cron: "0 9 * * 0"              # Sundays 09:00 UTC: weekly summary of the £500 test
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (recommended), full, mark (prices only) or weekly"
        default: auto
        type: choice
        options: [auto, full, mark, weekly]

permissions:
  contents: write   # save the paper portfolio after each run
  pages: write      # publish the app
  id-token: write

concurrency:
  group: capitol-signal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}   # optional: an email the SEC can contact; switches on 8-K events
      SITE_URL: https://kanyinsolaad8.github.io/capitol-signal/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Reuse recent Yahoo snapshots and bill files
        uses: actions/cache@v4
        with:
          path: |
            data/fund-*.json
            data/catalysts-*.json
            data/bills
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Decide what this run does
        id: plan
        run: python pipeline/plan.py "${{ github.event_name }}" "${{ github.event.schedule }}" "${{ inputs.mode }}" | tee -a "$GITHUB_OUTPUT"

      - name: Read the latest filings and market data
        id: build
        if: steps.plan.outputs.mode == 'full'
        continue-on-error: true
        run: python pipeline/build.py 90

      - name: If filings could not be read, reuse the last published ones
        if: steps.plan.outputs.mode != 'full' || steps.build.outcome != 'success'
        run: python pipeline/fallback.py ${{ steps.plan.outputs.mode == 'full' && 'failed' || 'ok' }}

      - name: Run the £500 paper test
        run: |
          if [ "${{ steps.plan.outputs.mode }}" = "full" ] && [ "${{ steps.build.outcome }}" = "success" ]; then python pipeline/portfolio.py daily;
          elif [ "${{ steps.plan.outputs.mode }}" = "weekly" ]; then python pipeline/portfolio.py weekly;
          else python pipeline/portfolio.py mark; fi

      - name: Build the app
        run: |
          python app/icons.py
          python app/render.py

      - name: Send phone alert
        continue-on-error: true
        run: |
          if [ "${{ steps.plan.outputs.mode }}" = "weekly" ]; then python pipeline/notify.py weekly;
          elif [ "${{ steps.build.outcome }}" = "success" ]; then python pipeline/notify.py moves;
          elif [ "${{ steps.plan.outputs.mode }}" = "full" ]; then python pipeline/notify.py partial; fi

      - name: Save the paper portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Paper portfolio: ${{ steps.plan.outputs.mode }} run $(date -u +'%F %H:%M')"
          git pull --rebase --autostash
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Alert on failure
        if: failure()
        continue-on-error: true
        run: python pipeline/notify.py failed

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-failed:
    needs: [update, deploy]
    if: always() && needs.update.result == 'success' && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Alert that publishing failed
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          curl -sS -H "Title: Capitol Signal: publishing failed" -d "The app could not be updated this time. It still shows the last good data; the next run in about two hours will retry." "https://ntfy.sh/$NTFY_TOPIC"
