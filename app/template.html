<title>Capitol Signal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column of filing "dockets" under a sticky masthead; three views share one filter bar. */
:root {
  --paper: #f3f4f1; --sheet: #ffffff; --ink: #18202b; --muted: #5b6573; --rule: #d9dcd6;
  --accent: #2f4a8a; --accent-soft: #e4e9f5;
  --buy: #1f7a4d; --buy-soft: #dcefe4; --sell: #b23b2e; --sell-soft: #f6e1dd; --warn: #9a6a00; --warn-soft: #f6ecd2;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11151b; --sheet: #191f27; --ink: #e6e9ee; --muted: #98a2b0; --rule: #2a323d;
  --accent: #8fa8e6; --accent-soft: #232d43;
  --buy: #5cc48f; --buy-soft: #173226; --sell: #ee8577; --sell-soft: #3a1f1b; --warn: #e2b44f; --warn-soft: #3a2f14;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #11151b; --sheet: #191f27; --ink: #e6e9ee; --muted: #98a2b0; --rule: #2a323d;
  --accent: #8fa8e6; --accent-soft: #232d43;
  --buy: #5cc48f; --buy-soft: #173226; --sell: #ee8577; --sell-soft: #3a1f1b; --warn: #e2b44f; --warn-soft: #3a2f14;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet) }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule) }
.mast { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-block: 12px 6px }
h1 { font: 700 28px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 0 }
h1 span { color: var(--accent) }
.stamp { font: 500 11.5px/1.3 var(--mono); color: var(--muted) }
nav { display: flex; gap: 4px; padding-block: 4px 0 }
nav button { font: 600 15px var(--display); letter-spacing: .04em; text-transform: uppercase; background: none; border: 0; color: var(--muted);
  padding: 8px 7px 9px; border-bottom: 3px solid transparent; cursor: pointer }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }

.notice { font-size: 12.5px; color: var(--muted); padding-block: 10px; border-bottom: 1px dashed var(--rule) }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 12px }
.filters input, .filters select { font: 14px var(--body); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; min-width: 0 }
.filters input { flex: 1 1 180px }
.chk { white-space: nowrap; display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted) }
.count { font: 12px var(--mono); color: var(--muted); padding-block: 0 8px }

.list { display: grid; gap: 12px; padding-block: 0 32px }
.docket { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; min-width: 0 }
.dhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px }
.tk { font: 700 26px/1 var(--display); letter-spacing: .03em }
.co { color: var(--muted); font-size: 13.5px; flex: 1 1 160px; min-width: 0 }
.score { display: flex; align-items: center; gap: 8px; font: 500 12px var(--mono); color: var(--muted) }
.pips { display: flex; gap: 3px }
.pips i { width: 10px; height: 14px; border-radius: 2px; background: var(--rule) }
.pips i.on { background: var(--accent) }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px 14px; margin-block: 12px; padding-block: 10px; border-block: 1px solid var(--rule) }
.fact b { display: block; font: 600 11px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.fact span { font: 500 15px var(--mono); font-variant-numeric: tabular-nums }
.pos { color: var(--buy) } .neg { color: var(--sell) }

.who { font-size: 13.5px; margin-block: 6px }
.who strong { font-weight: 600 }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-block: 6px }
.chip { font: 500 11.5px var(--body); padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent) }
.pill { font: 700 11px var(--body); letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; white-space: nowrap }
.pill.Buy { background: var(--buy-soft); color: var(--buy) }
.pill.Sell, .pill.Sell-partial { background: var(--sell-soft); color: var(--sell) }
.pill.Exchange { background: var(--accent-soft); color: var(--accent) }
.pill.late { background: var(--warn-soft); color: var(--warn) }
.party { font: 700 11px var(--mono); padding: 1px 5px; border-radius: 3px; border: 1px solid currentColor }
.party.D { color: #3563c9 } .party.R { color: #c2412f } .party.I { color: var(--muted) }

.race { display: grid; gap: 5px; margin-block: 10px }
.race-row { display: grid; grid-template-columns: 74px 1fr 64px; align-items: center; gap: 8px; font: 12px var(--mono) }
.track { position: relative; height: 10px; background: var(--paper); border-radius: 2px }
.track .zero { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted) }
.track .bar { position: absolute; top: 0; bottom: 0; border-radius: 2px }
.race-row .v { text-align: right }

details { margin-top: 8px }
summary { cursor: pointer; font: 600 13px var(--body); color: var(--accent) }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 6px 16px; margin-block: 8px 2px }
.meter { display: flex; align-items: center; gap: 8px; font: 500 12px var(--mono); color: var(--muted) }
.meter b { font: 600 11px var(--body); letter-spacing: .06em; text-transform: uppercase; min-width: 74px }
.pips i.on.data { background: var(--buy) }
.links { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; font-size: 13.5px }
.links small { display: block; color: var(--muted) }
.checks { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; font-size: 13.5px }
.checks .mk { font: 700 13px var(--mono) }
.checks .y { color: var(--buy) } .checks .n { color: var(--muted) }
.checks small { color: var(--muted); display: block }
.tbl { overflow-x: auto; margin-top: 8px }
table { border-collapse: collapse; width: 100%; font-size: 13px }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap }
th { font: 600 11px var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted) }
td.num, th.num { text-align: right }

.trade { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px }
.trade .l1 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0 }
.trade .tkr { font: 700 20px/1 var(--display); letter-spacing: .03em }
.trade .meta { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px }
.trade .amt { font: 500 13px var(--mono); text-align: right }
.empty { padding: 32px 0; text-align: center; color: var(--muted) }
.test { padding-block: 4px 40px; display: grid; gap: 12px }
.lede { font-size: 13.5px; color: var(--muted); margin: 0; max-width: 65ch }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.tile { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px }
.tile b { font: 600 11px var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted) }
.tile .big { font: 600 clamp(17px, 4.8vw, 24px) var(--mono); font-variant-numeric: tabular-nums }
.tile { min-width: 0 }
.tile .sw { width: 22px; height: 4px; border-radius: 2px }
.lc { margin-block: 8px }
.lc-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 4px }
.lc-legend span, .lc-tip-row { display: inline-flex; align-items: center; gap: 6px }
.lc-legend i, .lc-tip-row i { width: 14px; height: 2px; border-radius: 1px; display: inline-block }
.lc-wrap { position: relative; touch-action: pan-y; outline: none; border-radius: 6px }
.lc-wrap:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.lc-wrap svg { width: 100%; height: auto; display: block; overflow: visible }
.lc-wrap svg > :not(.lc-hit) { pointer-events: none }
.lc-grid { stroke: var(--rule); stroke-width: 1 } .lc-grid.base { stroke: var(--muted); stroke-dasharray: 4 4 }
.lc-tick { fill: var(--muted); font: 11px var(--mono) }
.lc-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round }
.lc-end, .lc-dot { stroke: var(--sheet); stroke-width: 2 }
.lc-hair { stroke: var(--muted); stroke-width: 1 }
.lc-hit { cursor: crosshair }
.lc-mark circle { stroke: var(--sheet); stroke-width: 2 } .lc-mark text { font: 700 9px var(--body); fill: #fff; pointer-events: none }
.lc-mark.buy circle { fill: var(--buy) } .lc-mark.sell circle { fill: var(--sell) }
.lc-tip { position: absolute; top: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; font-size: 12px; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.12); min-width: 120px; max-width: 220px }
.lc-tip-date { color: var(--muted); font: 11px var(--mono); margin-bottom: 2px }
.lc-tip-row b { font: 600 12.5px var(--mono); color: var(--ink) } .lc-tip-row span { color: var(--muted) }
.lc-tip-note { color: var(--ink); font-size: 11.5px; margin-top: 3px; border-top: 1px dashed var(--rule); padding-top: 3px }
tr.pos-row { cursor: pointer } tr.pos-row:hover td { background: var(--paper) }
tr.pos-row td.why::before { content: "▸ "; color: var(--accent) } tr.pos-row.open td.why::before { content: "▾ " }
tr.pos-detail td { white-space: normal; background: var(--paper) }
.cat-grid { display: grid; gap: 10px; margin-top: 8px }
.cat-grid h4 { font: 600 11px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px }
.chart { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 8px }
.chart svg { width: 100%; height: auto; display: block }
h2.sub { font: 700 17px var(--display); letter-spacing: .05em; text-transform: uppercase; margin: 10px 0 0 }
td.why { white-space: normal; min-width: 0 }
td.why small { display: block; color: var(--muted); font-size: 12px; line-height: 1.35 }
.rules { white-space: pre-wrap; font: 12.5px/1.5 var(--mono); color: var(--muted); margin: 8px 0 0 }
nav { overflow-x: auto; scrollbar-width: none }
nav button { white-space: nowrap }
.method { font-size: 13.5px; color: var(--muted); max-width: 65ch; padding-block: 8px 40px }
.method h2 { font: 700 18px var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink); margin: 16px 0 6px }
.method p { margin: 0 0 10px }
@media (prefers-reduced-motion: no-preference) { .docket { transition: border-color .15s } .docket:hover { border-color: var(--muted) } }
</style>

<header>
  <div class="wrap">
    <div class="mast">
      <h1>Capitol <span>Signal</span></h1>
      <div class="stamp" id="stamp"></div>
    </div>
    <nav role="tablist">
      <button role="tab" id="tab-test" aria-selected="true" data-view="test">£500</button>
      <button role="tab" id="tab-signals" aria-selected="false" data-view="signals">Signals</button>
      <button role="tab" id="tab-trades" aria-selected="false" data-view="trades">Filings</button>
      <button role="tab" id="tab-members" aria-selected="false" data-view="members">Members</button>
      <button role="tab" id="tab-method" aria-selected="false" data-view="method">Method</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <p class="notice">Research aid built from public STOCK Act disclosures and Yahoo Finance analyst data. Not financial advice. Disclosures arrive up to 45 days after the trade, and amounts are reported as ranges.</p>
  <div class="filters" id="filters">
    <input id="q" type="search" placeholder="Search ticker, company or member" aria-label="Search">
    <select id="chamber" aria-label="Chamber"><option value="">Both chambers</option><option>House</option><option>Senate</option></select>
    <select id="side" aria-label="Transaction type"><option value="">Buys and sells</option><option value="Buy">Buys only</option><option value="Sell">Sells only</option></select>
    <label class="chk" id="minwrap"><input type="checkbox" id="strong"> Political link 2+ only</label>
  </div>
  <div class="count" id="count"></div>
  <section id="view-test" class="test"></section>
  <section id="view-signals" class="list" hidden></section>

  <section id="view-members" class="list" hidden></section>
  <section id="view-method" class="method" hidden></section>
</main>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const P = JSON.parse(document.getElementById('portfolio').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = iso => iso ? new Date(iso.slice(0, 10) + 'T12:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'2-digit'}) : '—';
const pct = v => { if (v == null) return '—'; const r = Math.round(v * 10) / 10; return r === 0 ? '<span>0.0%</span>' : `<span class="${r > 0 ? 'pos' : 'neg'}">${r > 0 ? '+' : ''}${r.toFixed(1)}%</span>`; };
const money = v => v == null ? '—' : '$' + (v >= 1000 ? v.toLocaleString('en-US', {maximumFractionDigits: 0}) : Number(v).toFixed(2));
const gbp = v => v == null ? '—' : '£' + Number(v).toFixed(2);
const cons = c => c ? esc(c.replace('_', ' ')) : '—';
const partyOf = t => esc((t.party || '?')[0]);
const sideClass = t => t.type.startsWith('Sell') ? (t.type === 'Sell' ? 'Sell' : 'Sell-partial') : esc(t.type);
const who = t => t.display || t.member;
const VIEWS = ['test', 'signals', 'trades', 'members', 'method'];
const SHOW = 80;

$('#stamp').textContent = `Filings ${fmtD(D.since)} – ${fmtD(D.generated)} · ${D.trades.length} trades · updated ${new Date(D.generated).toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}`;

let view = 'test';
try { const v = localStorage.getItem('cs-view'); if (VIEWS.includes(v)) view = v } catch (e) {}

function filt() {
  return { q: $('#q').value.trim().toLowerCase(), ch: $('#chamber').value, side: $('#side').value, strong: $('#strong').checked };
}
function tradeMatch(t, f) {
  if (f.ch && t.chamber !== f.ch) return false;
  if (f.side && !t.type.startsWith(f.side)) return false;
  if (f.q && !(`${t.ticker} ${t.asset || ''} ${t.member} ${t.display || ''}`.toLowerCase().includes(f.q))) return false;
  return true;
}

/* ---------- interactive line charts (tap or hover for values; arrow keys when focused) ---------- */
const CHARTS = {};
let chartSeq = 0;
function chartSlot(spec) { const id = 'c' + (++chartSeq); CHARTS[id] = spec; return `<div class="lc" data-chart="${id}"></div>`; }
function mountCharts(root) { root.querySelectorAll('.lc[data-chart]').forEach(el => { const s = CHARTS[el.dataset.chart]; if (s && !el.dataset.done && el.clientWidth > 0) { el.dataset.done = 1; drawChart(el, s); } }); }
function resetCharts() { for (const k in CHARTS) delete CHARTS[k]; }
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function niceTicks(lo, hi, n) {
  const step0 = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(step0 || 1))), r = step0 / mag;
  const step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * mag, out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
/* spec: {dates:[iso], series:[{name, color, values:[num|null]}], fmt:v=>str, markers:[{i, label, kind}], title} */
function drawChart(el, spec) {
  const W = Math.max(300, Math.round(el.clientWidth) || 640), H = Math.round(Math.min(240, Math.max(170, W * 0.42))), L = 50, R = 12, T = 12, B = 24, n = spec.dates.length;
  const all = spec.series.flatMap(s => s.values).filter(v => v != null);
  if (n < 2 || !all.length) { el.innerHTML = '<p class="who">Not enough data for a chart yet.</p>'; return; }
  let lo = Math.min(...all), hi = Math.max(...all);
  if (spec.baseline != null) { lo = Math.min(lo, spec.baseline); hi = Math.max(hi, spec.baseline); }
  const pad = Math.max((hi - lo) * 0.08, Math.abs(hi) * 0.002, 0.5); lo -= pad; hi += pad;
  const x = i => L + i * (W - L - R) / (n - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const legend = document.createElement('div'); legend.className = 'lc-legend';
  spec.series.forEach(s => { const k = document.createElement('span'); const sw = document.createElement('i'); sw.style.background = `var(${s.color})`; k.append(sw, document.createTextNode(s.name)); legend.append(k); });
  const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': spec.title || 'Line chart'});
  niceTicks(lo, hi, 3).forEach(v => {
    svg.append(svgEl('line', {x1: L, x2: W - R, y1: y(v), y2: y(v), class: 'lc-grid' + (v === spec.baseline ? ' base' : '')}));
    const t = svgEl('text', {x: L - 8, y: y(v) + 4, 'text-anchor': 'end', class: 'lc-tick'}); t.textContent = spec.fmt(v); svg.append(t);
  });
  if (spec.baseline != null && !niceTicks(lo, hi, 3).includes(spec.baseline)) svg.append(svgEl('line', {x1: L, x2: W - R, y1: y(spec.baseline), y2: y(spec.baseline), class: 'lc-grid base'}));
  [[0, 'start'], [n - 1, 'end']].forEach(([i, a]) => { const t = svgEl('text', {x: x(i), y: H - 6, 'text-anchor': a, class: 'lc-tick'}); t.textContent = fmtD(spec.dates[i]); svg.append(t); });
  spec.series.forEach(s => {
    let d = '', pen = false;
    s.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); pen = true; });
    svg.append(svgEl('path', {d, class: 'lc-line', style: `stroke:var(${s.color})`}));
    const li = s.values.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
    if (li != null) svg.append(svgEl('circle', {cx: x(li), cy: y(s.values[li]), r: 4, class: 'lc-end', style: `fill:var(${s.color})`}));
  });
  const main = spec.series[0].values;
  (spec.markers || []).forEach(m => {
    if (main[m.i] == null) return;
    const g = svgEl('g', {class: 'lc-mark ' + m.kind});
    g.append(svgEl('circle', {cx: x(m.i), cy: y(main[m.i]), r: 7}));
    const t = svgEl('text', {x: x(m.i), y: y(main[m.i]) + 3.5, 'text-anchor': 'middle'}); t.textContent = m.kind === 'buy' ? 'B' : 'S';
    g.append(t); svg.append(g);
  });
  const hair = svgEl('line', {y1: T, y2: H - B, class: 'lc-hair', visibility: 'hidden'}); svg.append(hair);
  const dots = spec.series.map(s => { const c = svgEl('circle', {r: 4.5, class: 'lc-dot', style: `fill:var(${s.color})`, visibility: 'hidden'}); svg.append(c); return c; });
  const hit = svgEl('rect', {x: L, y: 0, width: W - L - R, height: H, fill: 'transparent', class: 'lc-hit'}); svg.append(hit);
  const tip = document.createElement('div'); tip.className = 'lc-tip'; tip.hidden = true;
  const wrap = document.createElement('div'); wrap.className = 'lc-wrap'; wrap.tabIndex = 0; wrap.append(svg, tip);
  wrap.setAttribute('aria-label', (spec.title || 'Chart') + '. Use left and right arrow keys to read values.');
  let cur = n - 1;
  function show(i) {
    cur = Math.max(0, Math.min(n - 1, i));
    hair.setAttribute('x1', x(cur)); hair.setAttribute('x2', x(cur)); hair.setAttribute('visibility', 'visible');
    tip.replaceChildren();
    const h = document.createElement('div'); h.className = 'lc-tip-date'; h.textContent = fmtD(spec.dates[cur]); tip.append(h);
    spec.series.forEach((s, k) => {
      const v = s.values[cur];
      if (v == null) { dots[k].setAttribute('visibility', 'hidden'); return; }
      dots[k].setAttribute('cx', x(cur)); dots[k].setAttribute('cy', y(v)); dots[k].setAttribute('visibility', 'visible');
      const row = document.createElement('div'); row.className = 'lc-tip-row';
      const key = document.createElement('i'); key.style.background = `var(${s.color})`;
      const val = document.createElement('b'); val.textContent = spec.fmt(v);
      const nm = document.createElement('span'); nm.textContent = s.name;
      row.append(key, val, nm); tip.append(row);
    });
    (spec.markers || []).filter(m => m.i === cur).forEach(m => { const r = document.createElement('div'); r.className = 'lc-tip-note'; r.textContent = m.label; tip.append(r); });
    tip.hidden = false;
    const px = x(cur) / W * wrap.clientWidth;
    tip.style.left = Math.min(Math.max(px - tip.offsetWidth / 2, 0), wrap.clientWidth - tip.offsetWidth) + 'px';
  }
  function hide() { hair.setAttribute('visibility', 'hidden'); dots.forEach(d => d.setAttribute('visibility', 'hidden')); tip.hidden = true; }
  function fromEvent(e) { const r = svg.getBoundingClientRect(); const sx = (e.clientX - r.left) / r.width * W; return Math.round((sx - L) / (W - L - R) * (n - 1)); }
  hit.addEventListener('pointermove', e => show(fromEvent(e)));
  hit.addEventListener('pointerdown', e => show(fromEvent(e)));
  hit.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
  wrap.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') { show(cur - 1); e.preventDefault(); } if (e.key === 'ArrowRight') { show(cur + 1); e.preventDefault(); } if (e.key === 'Escape') hide(); });
  wrap.addEventListener('focus', () => show(cur));
  wrap.addEventListener('blur', hide);
  el.replaceChildren(legend, wrap);
}

const STRATS = [['filtered', 'Filtered', '--s1'], ['copy', 'Plain copy', '--s2'], ['sp500', 'S&P 500', '--s3']];

function strategyChart(hist) {
  if (hist.length < 2) return `<p class="who">The chart starts after the second run. Day one: ${fmtD(hist[0]?.date)}.</p>`;
  return chartSlot({title: 'Value of each £500 line', dates: hist.map(h => h.date), baseline: P.start_gbp,
    fmt: v => '£' + v.toFixed(v >= 1000 ? 0 : 2), series: STRATS.map(([k, label, c]) => ({name: label, color: c, values: hist.map(h => h[k])}))});
}

function positionChart(p) {
  const spy = P.strategies.sp500.positions.SPY, sh = new Map((spy && spy.history || []).map(([d, v]) => [d, v]));
  const hist = (p.history || [[p.entry_date, p.entry_price]]);
  if (hist.length < 2) return '<p class="who">The price line starts after the next daily run.</p>';
  const base = hist[0][1], sbase = sh.get(hist[0][0]);
  return chartSlot({title: 'Move since bought', dates: hist.map(h => h[0]), baseline: 0, fmt: v => (v > 0 ? '+' : '') + v.toFixed(1) + '%',
    series: [{name: 'This holding', color: '--s1', values: hist.map(h => (h[1] / base - 1) * 100)},
             {name: 'S&P 500', color: '--s3', values: hist.map(h => sh.has(h[0]) && sbase ? (sh.get(h[0]) / sbase - 1) * 100 : null)}]});
}

function holdings(k) {

function race(c) {
  const rows = [[c.ticker, c.since_first_buy], [c.sector_etf ? c.sector_etf + ' sector' : null, c.etf_since_first_buy], ['S&P 500', c.spy_since_first_buy]]
    .filter(r => r[0] && r[1] != null);
  if (!rows.length) return '';
  const m = Math.max(10, ...rows.map(r => Math.abs(r[1])));
  return `<div class="race" aria-label="Price move since first buy">${rows.map(([k, v]) => {
    const w = Math.abs(v) / m * 50, left = v >= 0 ? 50 : 50 - w;
    return `<div class="race-row"><span>${esc(k)}</span><span class="track"><span class="bar" style="left:${left}%;width:${w}%;background:var(${v >= 0 ? '--buy' : '--sell'})"></span><span class="zero"></span></span><span class="v">${pct(v)}</span></div>`;
  }).join('')}</div>`;
}

function stockChart(c, trades) {
  const dates = D.chart_dates, idx = new Map(dates.map((d, i) => [d, i]));
  const near = d => { if (idx.has(d)) return idx.get(d); const j = dates.findIndex(x => x >= d); return j < 0 ? -1 : j; };
  const first = c.series.findIndex(v => v != null), sp0 = D.spy_series[first];
  if (first < 0) return '';
  const markers = trades.filter(t => t.trade_date >= dates[0]).map(t => ({i: near(t.trade_date), kind: t.type === 'Buy' ? 'buy' : 'sell',
    label: `${who(t)} ${t.type === 'Buy' ? 'bought' : 'sold'} (${t.amount})`})).filter(m => m.i >= 0);
  return chartSlot({title: c.ticker + ' price against the S&P 500 over six months', dates, baseline: 0,
    fmt: v => (v > 0 ? '+' : '') + v.toFixed(1) + '%', markers,
    series: [{name: c.ticker, color: '--s1', values: c.series.map(v => v == null ? null : (v / c.series[first] - 1) * 100)},
             {name: 'S&P 500', color: '--s3', values: D.spy_series.map(v => v == null || !sp0 ? null : (v / sp0 - 1) * 100)}]});
}

function catalystBlock(cat, c) {
  const an = cat.analysts, est = cat.estimates, con = cat.contracts, sec = cat.sec;
  const usd = v => '$' + (v >= 1e9 ? (v / 1e9).toFixed(1) + 'bn' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'm' : Math.round(v).toLocaleString('en-US'));
  const anList = an && an.items.length ? `<ul class="links">${an.items.map(a => `<li><span class="pill ${a.direction === 'up' ? 'Buy' : a.direction === 'down' ? 'Sell' : 'Exchange'}">${a.direction === 'up' ? 'Up' : a.direction === 'down' ? 'Down' : 'Held'}</span> ${esc(a.firm)}: ${esc(a.to || a.action)}${a.target ? ` · target $${a.target}${a.prior_target && a.prior_target !== a.target ? ` (was $${a.prior_target})` : ''}` : ''}<small>${fmtD(a.date)}</small></li>`).join('')}</ul>` : '<p class="who">No analyst actions in the last 30 days.</p>';
  const conList = con && con.items.length ? `<p class="who">${usd(con.total)} across ${con.count} awards in 90 days.</p><ul class="links">${con.items.map(x => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${usd(x.amount)} · ${esc(x.agency)}</a><small>${fmtD(x.date)} · ${esc(x.recipient)} · ${esc(x.what)}</small></li>`).join('')}</ul>` : '<p class="who">No new US government contract money found in the last 90 days.</p>';

    <div><h4>Earnings estimates, last 30 days</h4><p class="who">${est ? `${est.up} raised, ${est.down} cut` : 'No data'}${c.earnings_date ? ` · next results ${fmtD(c.earnings_date)}` : ''}</p></div>

  <h2>Where the data comes from</h2>
  <p>House trades: Periodic Transaction Reports from the House Clerk. Senate trades: the Senate eFD search. Only electronic filings are read; ${D.skipped_paper_filings.length} scanned paper filings in this window were skipped and are listed below.</p>
  <p>Committee seats: the public congress-legislators dataset. Bills: the official GovInfo bill status records, covering sponsors and co-sponsors. Government contracts: USAspending.gov, the official record of federal spending. Company events: SEC 8-K filings. Prices, targets, consensus, EPS, analyst actions, estimate revisions, earnings dates and peers: Yahoo Finance.</p>
  <h2>What counts and what doesn't</h2>
  <p>Only stock trades feed the scores and the £500 test. Shown in Filings but not scored: options (a bet that a price will fall can look like a buy), corrections to reports first filed before this 90-day window, and filings listing 50 or more purchases at once, which are portfolio set-ups or managed accounts rather than considered bets. When an amendment repeats a trade, only the latest version is kept, and trades marked Deleted are removed.</p>
  <p>A bill counts when the buyer sponsored or co-sponsored it within 120 days of the trade, either side, and its title names the company or targets the company's industry directly, such as a drug pricing bill for a drug maker or a banking bill for a bank. Broad themes like AI, data centres and crypto are not scored.</p>
  <p>News is not scored. Free news search could not reliably match a politician to a company, so each stock links to a ready-made search instead.</p>
  <p>All of these show access or interest. None of them proves anyone traded on private information.</p>
  <h2>Limits</h2>
  <p>Amounts are ranges. Some members file very late. Votes are not included yet. Yahoo data is unofficial and can be missing or stale. This is a research aid, not financial advice.</p>
  <h2>Skipped paper filings</h2>
  <p>${D.skipped_paper_filings.map(s => `<a href="${esc(s.source)}" target="_blank" rel="noopener">${esc(s.member)} (${fmtD(s.filing_date)})</a>`).join(', ') || 'None'}</p>`;
}

function render() {
  resetCharts();
  const f = filt();
  VIEWS.forEach(v => {
    $('#view-' + v).hidden = v !== view;
    $('#tab-' + v).setAttribute('aria-selected', v === view);
  });
  $('#filters').hidden = view === 'method' || view === 'test';
  $('#minwrap').hidden = view !== 'signals';
  ({test: renderTest, signals: renderSignals, trades: renderTrades, members: renderMembers, method: renderMethod})[view](f);
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.view; try { localStorage.setItem('cs-view', view) } catch (e) {} render(); window.scrollTo(0, 0);
}));
let typing; $('#q').addEventListener('input', () => { clearTimeout(typing); typing = setTimeout(render, 150); });
['chamber', 'side', 'strong'].forEach(id => $('#' + id).addEventListener('input', render));
render();
</script>
